<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lip Sync Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Lip Sync Animation</h1>
        
        <div class="controls">
            <div class="file-inputs">
                <label for="srt-upload" class="file-label">
                    <span>Upload SRT File</span>
                    <input type="file" id="srt-upload" accept=".srt" />
                </label>
                
                <label for="audio-upload" class="file-label">
                    <span>Upload Audio File</span>
                    <input type="file" id="audio-upload" accept="audio/*" />
                </label>
            </div>
            
            <div class="playback-controls">
                <button id="play-btn">Play</button>
                <button id="pause-btn">Pause</button>
                <button id="stop-btn">Stop</button>
                <span id="time-display">00:00 / 00:00</span>
            </div>
        </div>

        <div class="animation-area">
            <div class="character">
                <svg id="mouth-svg" width="200" height="150" viewBox="0 0 200 150">
                    <!-- Face outline -->
                    <ellipse cx="100" cy="75" rx="80" ry="65" fill="#FFD4A3" stroke="#E6B887" stroke-width="2"/>
                    
                    <!-- Eyes -->
                    <circle cx="75" cy="50" r="8" fill="#333"/>
                    <circle cx="125" cy="50" r="8" fill="#333"/>
                    
                    <!-- Nose -->
                    <ellipse cx="100" cy="65" rx="3" ry="5" fill="#E6B887"/>
                    
                    <!-- Mouth -->
                    <g id="mouth-shape">
                        <path id="mouth-path" d="M 80 90 Q 100 95 120 90" stroke="#333" stroke-width="2" fill="#8B0000"/>
                    </g>
                </svg>
            </div>
            
            <div class="subtitle-display">
                <div id="current-subtitle"></div>
            </div>
        </div>

        <div class="debug-info">
            <div>Current Viseme: <span id="current-viseme">rest</span></div>
            <div>Current Time: <span id="debug-time">0.00s</span></div>
        </div>
    </div>

    <audio id="audio-player" preload="metadata"></audio>
    <script src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
